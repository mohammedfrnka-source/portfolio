<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Design Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" id="pf-fontlink" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&amp;family=Alexandria:wght@300;400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style id="pf-style">
/* Layout: a print-shop studio sheet. Crop marks, registration targets and format specs frame every piece of work. Every token below is overridable from the page's own design panel. */
:root{
  --ink:#130D0F; --ink-2:#1D1517; --ivory:#EFE7DC; --muted:#A6978B; --wine:#A3283E; --brass:#C9A46A; --on-accent:#fff;
  --line:color-mix(in srgb,var(--ivory) 13%,transparent);
  --f-display:"Syne","Alexandria",system-ui,sans-serif;
  --f-body:"Alexandria",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --dw:800; --fs:1; --fs-h:1; --fs-name:1; --fs-role:1; --fs-card:1; --fs-mono:1; --name-track:-.03em; --rad:4px; --cols:3; --card-ratio:4/5;
  --gut:clamp(16px,4vw,48px); --max:1240px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--ivory);font-family:var(--f-body);font-size:calc(16px*var(--fs));line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.site{padding-inline:var(--gut)}
.bgl{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bgl,none)}
.wrap{max-width:var(--max);margin-inline:auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:calc(12px*var(--fs-mono));letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.muted{color:var(--muted)}
.pre{white-space:pre-line}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(var(--gut)*-1);padding:14px var(--gut);background:color-mix(in srgb,var(--ink) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:nowrap}
.nav .wrap > *{flex-shrink:0}
.nav .brand{flex-shrink:1}
.brand{font-family:var(--f-display);font-weight:var(--dw);font-size:calc(18px*var(--fs));letter-spacing:.02em;text-decoration:none;display:flex;align-items:center;min-width:0}
.brand img{display:block;width:auto;height:auto;max-height:var(--logo-nav-h,32px);max-width:min(220px,45vw);flex:none}
.nav-mark{height:var(--logo-nav-h,28px);width:calc(var(--logo-nav-h,28px)*1.59);display:block;flex:none}
.brand{gap:12px}
.hero-mark{height:var(--logo-h,120px);width:calc(var(--logo-h,120px)*1.59);max-width:100%;display:block;margin-bottom:clamp(20px,3vw,34px);overflow:visible}
.hero-mark .mk-m{stroke-dasharray:400;stroke-dashoffset:0;animation:mkdraw 1.3s .15s cubic-bezier(.65,0,.35,1) both}
.hero-mark .mk-f{animation:mkslide .9s 1s cubic-bezier(.2,.7,.1,1) both}
.no-anim-hero .hero-mark *,.editing .hero-mark *{animation:none}
@keyframes mkdraw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes mkslide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.name-block{margin-block:28px 8px;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.name-block .hero-name{margin:0}
.hero-logo{display:block;width:auto;height:auto;max-height:var(--logo-h,84px);max-width:min(100%,680px);margin-bottom:22px;animation:fade 1s .1s both}
.name-row{display:flex;align-items:center;gap:clamp(16px,2.5vw,36px);flex-wrap:wrap;min-width:0}
.name-row .hero-logo,.name-row .hero-mark,.name-row .logo-wrap{margin:0;flex:none}
.name-row .hero-name{min-width:0}
.hero-logo-add{margin-bottom:18px;border:1px dashed var(--brass);color:var(--brass);background:none;border-radius:10px;padding:14px 20px;font:500 14px "Alexandria",system-ui,sans-serif;cursor:pointer}
.logo-wrap{position:relative;display:inline-block;max-width:100%}
.logo-wrap .slot-ctl{inset:auto auto 26px 0;justify-content:flex-start}
.tl{display:flex;align-items:center;flex-wrap:wrap;gap:.6em 1em;margin-top:clamp(14px,2vw,24px);font-size:calc(clamp(13px,1.45vw,18px)*var(--fs-title));color:var(--tl-color,var(--brass));line-height:1.2;max-width:100%}
.tl-line{flex:none;width:3.6em;height:1px;background:currentColor;transform-origin:left center;animation:draw 1s .55s cubic-bezier(.2,.7,.1,1) both}
.tl[dir=rtl] .tl-line{transform-origin:right center}
.tl-en{font-family:var(--f-display);font-weight:500;letter-spacing:.42em;text-transform:uppercase;animation:track 1.3s .7s cubic-bezier(.2,.7,.1,1) both}
.tl-sep{flex:none;width:.42em;height:.42em;border:1px solid currentColor;transform:rotate(45deg);opacity:.8;animation:fade .8s 1.1s both}
.tl-ar{font-family:var(--f-body);font-weight:400;color:var(--muted);letter-spacing:0;text-transform:none;animation:fade .9s 1.2s both}
.tl-frame{border:1px solid currentColor;border-radius:999px;padding:.75em 1.5em;width:fit-content}
.tl-frame .tl-line{display:none}
.tl-hollow{flex-direction:column;align-items:flex-start;gap:.5em}
.tl-hollow .tl-line,.tl-hollow .tl-sep{display:none}
.tl-hollow .tl-en{font-size:3.4em;font-weight:var(--dw);letter-spacing:.04em;line-height:.95;color:transparent;-webkit-text-stroke:1px currentColor;white-space:normal;overflow-wrap:anywhere;animation:fade 1.2s .6s both}
.tl-hollow .tl-ar{font-size:1em}
.tl-stack{flex-direction:column;align-items:flex-start;gap:.55em}
.tl-stack .tl-sep{display:none}
.tl-stack .tl-line{width:100%;max-width:22em}
.no-anim-hero .tl *,.no-anim-hero .hero-logo,.editing .tl *,.editing .hero-logo{animation:none}
@keyframes draw{from{transform:scaleX(0)}to{transform:none}}
@keyframes track{from{letter-spacing:1.1em;opacity:0}to{letter-spacing:.42em;opacity:1}}
.nav ul{display:flex;gap:24px;list-style:none;margin:0;padding:0}
.nav ul a{text-decoration:none;color:var(--muted);font-size:calc(14px*var(--fs));transition:color .2s}
.nav ul a:hover{color:var(--ivory)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-size:calc(14px*var(--fs));font-weight:500;text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--ivory);cursor:pointer;font-family:inherit;transition:background .25s,border-color .25s,transform .25s}
.btn:hover{border-color:var(--ivory);transform:translateY(-1px)}
.btn.solid{background:var(--wine);border-color:var(--wine);color:var(--on-accent)}
.btn.solid:hover{background:color-mix(in srgb,var(--wine) 85%,var(--ivory))}
@media (max-width:860px){.nav ul{display:none}}

.hero{padding-block:clamp(40px,8vw,96px) 32px}
.hero-meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.hero-name{font-family:var(--f-display);font-weight:var(--dw);font-size:calc(clamp(52px,14vw,200px)*var(--fs-name));line-height:.95;letter-spacing:var(--name-track);margin-block:28px 8px;display:flex;align-items:flex-start;flex-wrap:wrap;gap:.08em .2em;overflow-wrap:anywhere}
.hero-name .word{display:inline-flex;overflow:hidden;padding-bottom:.04em}
.hero-name .ch{display:inline-block;animation:rise .9s cubic-bezier(.2,.7,.1,1) both}
.reg{width:clamp(34px,5vw,64px);height:auto;flex:none;margin-top:.08em;animation:spin 18s linear infinite;color:var(--brass)}
.hero-row{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,72px);align-items:end;margin-top:28px}
.hero-row.solo{grid-template-columns:1fr}
.hero-row > *{min-width:0}
.role{font-size:calc(clamp(22px,2.6vw,32px)*var(--fs-role));font-weight:500;line-height:1.35}
.tagline{color:var(--muted);margin-top:12px;max-width:52ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
@media (max-width:860px){.hero-row{grid-template-columns:1fr}}

.frame{position:relative;background:var(--ink-2);border-radius:var(--rad);overflow:hidden;max-width:100%;isolation:isolate;contain:paint}
.frame > img{max-width:100%}
.hidebar{position:fixed;z-index:65;font:500 12px "Alexandria",system-ui,sans-serif;padding:6px 12px;border-radius:999px;border:1px solid var(--brass);background:var(--ink-2);color:var(--ivory);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.frame > img,.frame > video{display:block;width:100%;height:100%;object-fit:cover}
.marks{position:relative}
.marks::before,.marks::after,.marks > .mk::before,.marks > .mk::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--brass);border-style:solid;opacity:.7;pointer-events:none;transition:opacity .35s}
.marks::before{top:-8px;left:-8px;border-width:1px 0 0 1px}
.marks::after{top:-8px;right:-8px;border-width:1px 1px 0 0}
.marks > .mk::before{bottom:-8px;left:-8px;border-width:0 0 1px 1px}
.marks > .mk::after{bottom:-8px;right:-8px;border-width:0 1px 1px 0}
.no-marks .marks::before,.no-marks .marks::after,.no-marks .marks > .mk::before,.no-marks .marks > .mk::after,.no-marks .reg{display:none}
.ph{position:absolute;inset:0;display:grid;place-content:center;gap:6px;text-align:center;padding:16px;
  background:linear-gradient(135deg,transparent 49.6%,var(--line) 50%,transparent 50.4%),linear-gradient(45deg,transparent 49.6%,var(--line) 50%,transparent 50.4%),radial-gradient(120% 90% at 30% 20%,color-mix(in srgb,var(--wine) 22%,transparent),transparent 60%),var(--ink-2)}
.ph b{font-weight:500;font-size:14px;color:var(--ivory)}
.ph .mono{font-size:11px}
.play{position:absolute;inset:auto auto 14px 14px;width:44px;height:44px;border-radius:50%;background:var(--ivory);color:var(--ink);display:grid;place-items:center;pointer-events:none}
.ext{position:absolute;inset:auto 12px 12px 12px;z-index:2;text-align:center;padding:10px 14px;border-radius:999px;background:var(--ivory);color:var(--ink);font-size:14px;font-weight:500;text-decoration:none}

.marquee{margin-block:56px 0;margin-inline:calc(var(--gut)*-1);border-block:1px solid var(--line);overflow:hidden;direction:ltr}
.marquee .track{display:flex;width:max-content;animation:slide 38s linear infinite}
.marquee span{font-size:calc(clamp(20px,3vw,34px)*var(--fs-h));font-weight:500;padding:18px 28px;white-space:nowrap;display:flex;align-items:center;gap:56px}
.marquee span::after{content:"";width:10px;height:10px;border:1px solid var(--brass);transform:rotate(45deg)}

section.block{padding-block:clamp(64px,10vw,128px) 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.sec-head .mono,.about-tx > .mono{display:block;margin-bottom:10px}
.sec-h,.sec-head h2{font-family:var(--f-display);font-weight:var(--dw);font-size:calc(clamp(32px,5vw,60px)*var(--fs-h));line-height:1.12}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-family:inherit;font-size:calc(14px*var(--fs));cursor:pointer;transition:all .2s}
.chip:hover{color:var(--ivory)}
.chip[aria-pressed="true"]{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(24px,3vw,40px) clamp(16px,2.4vw,32px)}
@media (max-width:980px){.grid{grid-template-columns:repeat(min(var(--cols),2),minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:12px;min-width:0}
.card-open{all:unset;display:flex;flex-direction:column;gap:14px;cursor:pointer;min-width:0}
.card-open:focus-visible{outline:2px solid var(--brass);outline-offset:6px}
.card .frame{aspect-ratio:var(--card-ratio)}
.card .frame > img,.card .frame > video,.card .ph{transition:transform .8s cubic-bezier(.2,.7,.1,1)}
.card-open:hover .frame > img,.card-open:hover .frame > video,.card-open:hover .ph{transform:scale(1.04)}
.no-hover .card-open:hover .frame > img,.no-hover .card-open:hover .frame > video,.no-hover .card-open:hover .ph{transform:none}
.card .marks::before,.card .marks::after,.card .marks > .mk::before,.card .marks > .mk::after{opacity:0}
.card-open:hover .marks::before,.card-open:hover .marks::after,.card-open:hover .marks > .mk::before,.card-open:hover .marks > .mk::after{opacity:.8}
.card-meta{display:flex;justify-content:space-between;gap:12px}
.card h3{font-size:calc(20px*var(--fs-card));font-weight:500;line-height:1.35}
.card .client{color:var(--muted);font-size:calc(14px*var(--fs))}
.view{position:absolute;inset:auto 14px 14px auto;background:var(--ink);color:var(--ivory);font-size:13px;padding:7px 14px;border-radius:999px;opacity:0;transform:translateY(8px);transition:.3s}
.card-open:hover .view,.editing .view{opacity:1;transform:none}

.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(28px,6vw,88px);align-items:center}
.about-ph{max-width:440px;width:100%}
.about-bio{margin-top:18px;font-size:calc(17px*var(--fs));max-width:58ch}
.stats{display:flex;flex-wrap:wrap;gap:20px 40px;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat-n{font-family:var(--f-display);font-weight:var(--dw);font-size:calc(clamp(32px,4vw,48px)*var(--fs-h));line-height:1;color:var(--ivory)}
@media (max-width:860px){.about{grid-template-columns:1fr}}

.reels{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 8px 16px;scrollbar-width:thin}
.reel{flex:0 0 clamp(190px,22vw,250px);scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;min-width:0}
.reel .frame{aspect-ratio:9/16;width:100%;cursor:pointer}
.reel p{font-size:calc(15px*var(--fs))}

.ba-wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.ba-wrap > *{min-width:0}
@media (max-width:860px){.ba-wrap{grid-template-columns:1fr}}
.ba{position:relative;aspect-ratio:4/5;width:100%;max-width:520px;user-select:none;direction:ltr}
.ba .layer{position:absolute;inset:0}
.ba .after{clip-path:inset(0 0 0 var(--pos,50%))}
.ba .handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;background:var(--ivory);transform:translateX(-1px);pointer-events:none;z-index:1}
.ba .handle::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--ivory);color:var(--ink);display:grid;place-items:center;font-size:18px}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;z-index:2}
.ba .tag{position:absolute;top:12px;padding:4px 10px;background:var(--ink);border-radius:999px;z-index:1}
.ba .tag.l{left:12px}.ba .tag.r{right:12px}
.ba .slot-ctl{inset:auto auto 10px 10px;justify-content:flex-start;max-width:46%}
.ba .slot-ctl.r{inset:auto 10px 10px auto;justify-content:flex-end}
.ba-text h3{font-size:calc(clamp(24px,3vw,36px)*var(--fs-h));font-weight:500;line-height:1.3;margin-block:6px 14px}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.step{background:var(--ink);padding:28px 24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.step h3{font-size:calc(22px*var(--fs-h));font-weight:500}
.step-n{font-family:var(--f-display);font-weight:var(--dw);font-size:calc(40px*var(--fs-h));line-height:1;color:var(--wine)}

.gifs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:22px;align-items:start}
.gif-item{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.gif-t{font-size:calc(15px*var(--fs))}
.gifs .add-tile{min-height:200px}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.logo-tile{display:flex;flex-direction:column;gap:8px;min-width:0}
.logo-tile .frame{aspect-ratio:3/2;background:color-mix(in srgb,var(--ivory) 5%,var(--ink-2))}
.logo-tile .frame > img{object-fit:contain;padding:16%}
.mono-logos .logo-tile .frame > img{filter:grayscale(1);opacity:.8;transition:filter .3s,opacity .3s}
.mono-logos .logo-tile:hover .frame > img{filter:none;opacity:1}

.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.quote{border:1px solid var(--line);border-radius:var(--rad);padding:28px;display:flex;flex-direction:column;gap:18px;min-width:0;background:color-mix(in srgb,var(--ink-2) 60%,transparent)}
.quote .q{font-size:calc(18px*var(--fs));line-height:1.7}
.quote .q::before{content:"“";display:block;font-family:var(--f-display);font-size:56px;line-height:.6;color:var(--wine);margin-bottom:10px}
.quote .who{display:flex;flex-direction:column}

.services{border-top:1px solid var(--line)}
.svc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:24px;align-items:baseline;padding-block:26px;border-bottom:1px solid var(--line);transition:padding .3s}
.svc:hover{padding-inline-start:12px}
.svc h3{font-size:calc(clamp(20px,2.4vw,28px)*var(--fs-h));font-weight:500}
.svc p{color:var(--muted)}
@media (max-width:760px){.svc{grid-template-columns:1fr;gap:6px}}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:40px}
.tools span{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:calc(14px*var(--fs))}

.contact{padding-block:clamp(80px,12vw,150px) 48px}
.contact h2{font-family:var(--f-display);font-weight:var(--dw);font-size:calc(clamp(36px,7vw,96px)*var(--fs-h));line-height:1.08;max-width:16ch}
.contact-list{margin-top:48px;border-top:1px solid var(--line)}
.c-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:20px;border-bottom:1px solid var(--line)}
.c-row > div{min-width:0}
.c-row .val{font-size:calc(clamp(18px,2.4vw,26px)*var(--fs));overflow-wrap:anywhere}
.c-row .ltr{direction:ltr;text-align:right}
.c-row .acts{display:flex;gap:8px;flex-wrap:wrap}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:32px;border-top:1px solid var(--line);margin-top:64px}
.wa-float{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:30;width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);text-decoration:none}
.wa-float svg{width:28px;height:28px}

.modal{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 96%,transparent);backdrop-filter:blur(8px);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gut) calc(env(safe-area-inset-bottom,0px) + 96px);animation:fade .3s ease both}
.modal-in{max-width:1000px;margin-inline:auto}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;padding-block:10px;background:var(--ink);z-index:4}
.m-title{font-family:var(--f-display);font-weight:var(--dw);font-size:calc(clamp(30px,5vw,56px)*var(--fs-h));line-height:1.12;margin-block:28px 18px}
.m-specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;border-block:1px solid var(--line);padding-block:18px;margin-bottom:22px}
